services:
  - type: web
    name: agrirain
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: AGRIRAIN_DATABASE
        value: /tmp/prediction_history.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
