<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a32">
  <title>Rainfall — A Study in Stillness</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      background: #102a32;
      color: #f4f1e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      background: linear-gradient(145deg, #102a32, #1b4145 55%, #274d4b);
    }

    main {
      width: min(100%, 960px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #b7cbc2;
      font: 600 0.75rem/1.4 system-ui, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.6rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 560px;
      margin: 18px auto 34px;
      color: #d0ddd5;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    figure { margin: 0; }

    img {
      display: block;
      width: 100%;
      max-height: 68vh;
      object-fit: cover;
      border: 1px solid rgb(244 241 232 / 24%);
      border-radius: 8px;
      box-shadow: 0 28px 80px rgb(0 0 0 / 32%);
    }

    figcaption {
      margin-top: 14px;
      color: #b7cbc2;
      font: 0.85rem/1.5 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A moment with the weather</p>
    <h1>After the Rain</h1>
    <p class="intro">Rain reshapes the landscape one quiet drop at a time, bringing the air, earth, and sky together.</p>
    <figure>
      <img
        src="https://i.pinimg.com/originals/78/3e/6d/783e6d9cd6b0b2c6c6614c801d3670f8.jpg"
        alt="A rain-soaked landscape beneath a moody sky"
      >
      <figcaption>A pause in the passing weather.</figcaption>
    </figure>
  </main>
</body>
</html>
